; Ajustes de PHP para los sitios gestionados por GoControlPanel.

expose_php = Off
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 40

; Errores al log del contenedor, nunca a la respuesta HTTP.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

date.timezone = UTC

; OPcache: imprescindible para el rendimiento en producción.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Endurecimiento básico del entorno compartido.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,dl
allow_url_fopen = On
allow_url_include = Off

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
