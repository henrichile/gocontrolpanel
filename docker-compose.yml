name: gocontrolpanel

services:
  # --- Prepara /srv/gocp/accounts antes de arrancar el panel ---------------
  # El panel corre sin privilegios (usuario "nonroot", imagen distroless) y no
  # puede hacer chown de su propio directorio de datos. Este servicio corre
  # como root, una sola vez en cada "docker compose up", y deja el directorio
  # con el dueño y los permisos correctos, sin importar en qué estado haya
  # quedado en el host (recién creado por root, restaurado de un backup,
  # etc.). Así el panel nunca falla con "permission denied" al crear la
  # carpeta de una cuenta nueva y no hace falta ningún chown manual.
  volumes-init:
    image: busybox:1
    container_name: gocp-volumes-init
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /data
        chown 65532:65532 /data
        chmod 750 /data
    volumes:
      # ":z" re-etiqueta el directorio para SELinux (RHEL/AlmaLinux/Rocky con
      # SELinux en enforcing); en distros sin SELinux la opción se ignora.
      - /srv/gocp/accounts:/data:z
    restart: "no"

  # --- Caddy de borde: TLS y reverse proxy hacia los sitios ----------------
  edge:
    image: caddy:2-alpine
    # Para activar el WAF (Coraza + OWASP CRS) hay que compilar Caddy con
    # xcaddy: cambia la línea de arriba por "build: deploy/edge", corre
    # `docker compose build edge` a mano y confirma que arranca bien ANTES
    # de poner GOCP_WAF_ENABLED=true — ese build es pesado (descarga xcaddy
    # + el ruleset de OWASP) y no debe ser parte del "docker compose up"
    # normal de cada actualización.
    container_name: gocp-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    environment:
      GOCP_CADDY_EMAIL: ${GOCP_CADDY_EMAIL:-}
    volumes:
      - ./deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados: NO borrar, se perderían las emisiones
      - caddy_config:/config
    networks:
      - sites
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Panel de control -----------------------------------------------------
  panel:
    build:
      context: .
      args:
        VERSION: ${GOCP_VERSION:-dev}
    container_name: gocp-panel
    restart: unless-stopped
    # El panel corre como usuario "nonroot" (imagen distroless) y necesita
    # pertenecer al grupo dueño de /var/run/docker.sock en el host para poder
    # hablar con el demonio; ese GID varía entre distros y lo detecta install.sh.
    group_add:
      - "${GOCP_DOCKER_GID:?falta detectar el GID del grupo docker; vuelve a ejecutar install.sh}"
    depends_on:
      volumes-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      edge:
        condition: service_started
      sftp:
        condition: service_started
    environment:
      GOCP_ENV: production
      GOCP_LISTEN_ADDR: ":8080"
      GOCP_PUBLIC_URL: ${GOCP_PUBLIC_URL:?define la URL pública del panel}
      GOCP_DATABASE_URL: postgres://gocp:${POSTGRES_PASSWORD:?}@postgres:5432/gocp?sslmode=disable
      GOCP_JWT_SECRET: "${GOCP_JWT_SECRET:?genera uno con: openssl rand -hex 32}"
      GOCP_CADDY_ADMIN_URL: http://edge:2019
      GOCP_CADDY_EMAIL: ${GOCP_CADDY_EMAIL:-}
      GOCP_WAF_ENABLED: ${GOCP_WAF_ENABLED:-false}
      GOCP_RATE_LIMIT_PER_MINUTE: ${GOCP_RATE_LIMIT_PER_MINUTE:-240}
      GOCP_MYSQL_CONTAINER_NAME: gocp-mysql
      GOCP_BACKUP_RETENTION_DAYS: ${GOCP_BACKUP_RETENTION_DAYS:-14}
      GOCP_DOCKER_HOST: unix:///var/run/docker.sock
      GOCP_DOCKER_NETWORK: gocontrolpanel_sites
      GOCP_SITE_IMAGE_PREFIX: gocp/frankenphp
      GOCP_SITES_ROOT: /srv/gocp/accounts
      GOCP_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:?}@tcp(mysql:3306)/
      GOCP_MYSQL_HOST: mysql
      GOCP_SFTP_ADMIN_URL: http://sftp:8080
      GOCP_SFTP_ADMIN_USER: ${GOCP_SFTP_ADMIN_USER:-}
      GOCP_SFTP_ADMIN_PASSWORD: ${GOCP_SFTP_ADMIN_PASSWORD:-}
      GOCP_SFTP_PUBLIC_HOST: ${GOCP_SFTP_PUBLIC_HOST:-}
      GOCP_SFTP_PUBLIC_PORT: ${GOCP_SFTP_PUBLIC_PORT:-2022}
      GOCP_ADMIN_USER: ${GOCP_ADMIN_USER:-admin}
      GOCP_ADMIN_EMAIL: ${GOCP_ADMIN_EMAIL:-admin@localhost}
      GOCP_ADMIN_PASSWORD: ${GOCP_ADMIN_PASSWORD:-}
    volumes:
      # El panel crea y controla los contenedores de los sitios. Montar el
      # socket equivale a dar acceso root al host: mantén el panel accesible
      # solo a administradores y detrás de HTTPS.
      - /var/run/docker.sock:/var/run/docker.sock
      # Misma ruta dentro y fuera del contenedor, para que los bind mounts que
      # el panel pide a Docker apunten a directorios reales del host.
      # ":z" re-etiqueta el directorio para SELinux (RHEL/AlmaLinux/Rocky con
      # SELinux en enforcing); en distros sin SELinux la opción se ignora.
      - /srv/gocp/accounts:/srv/gocp/accounts:z
    networks:
      - sites
    healthcheck:
      test: ["CMD", "/usr/local/bin/gocpd", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- SFTP gestionado: acceso a archivos de cada cuenta --------------------
  # sftpgo crea usuarios virtuales (uno por cuenta) sin tocar /etc/passwd; el
  # panel los administra por su API interna (puerto 8080, solo red interna,
  # nunca publicado). El puerto 2022 sí se publica: es donde el cliente FTP
  # del usuario final (FileZilla, WinSCP, `sftp` por línea de comandos…) se
  # conecta para subir el código de su sitio.
  sftp:
    image: drakkan/sftpgo:v2
    container_name: gocp-sftp
    restart: unless-stopped
    depends_on:
      volumes-init:
        condition: service_completed_successfully
    environment:
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${GOCP_SFTP_ADMIN_USER:?falta el usuario admin de sftpgo; vuelve a ejecutar install.sh}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${GOCP_SFTP_ADMIN_PASSWORD:?falta la clave admin de sftpgo; vuelve a ejecutar install.sh}
      SFTPGO_HTTPD__BINDINGS__0__ADDRESS: 0.0.0.0
    ports:
      - "2022:2022"
    volumes:
      - sftpgo_data:/var/lib/sftpgo
      # Mismos home que ve el panel: los usuarios SFTP quedan encadenados
      # (chroot) a la carpeta de su propia cuenta dentro de esta ruta.
      - /srv/gocp/accounts:/srv/gocp/accounts:z
    networks:
      - sites
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- PostgreSQL: estado del panel ----------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: gocp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gocp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: gocp
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sites
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocp -d gocp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MariaDB: bases de datos de los clientes ------------------------------
  mysql:
    image: mariadb:11
    container_name: gocp-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=300
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sites
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- phpMyAdmin (opcional) ------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: gocp-phpmyadmin
    restart: unless-stopped
    profiles: ["extras"]
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 256M
    networks:
      - sites

networks:
  sites:
    name: gocontrolpanel_sites
    driver: bridge

volumes:
  pg_data:
  mysql_data:
  caddy_data:
  caddy_config:
  sftpgo_data:
